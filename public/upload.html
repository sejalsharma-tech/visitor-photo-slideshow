<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visitor Photo Upload</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="aurora-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="aurora-grid"></div>
  </div>

  <div class="card" id="tiltCard">
    <div class="pill-tag">
      <span class="live-dot"></span> Live Venue Stream
    </div>
    <h1>Share Your Moment</h1>
    <p class="subtitle">Upload photos to appear live on the big screen—returning visitors automatically replay past memories.</p>

    <form id="uploadForm">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" required placeholder="e.g. Aarav Patel" />
      </div>

      <div class="form-group">
        <label for="identifier">Email or Phone Number (recognizes returning visits)</label>
        <input type="text" id="identifier" required placeholder="e.g. aarav@example.com" />
      </div>

      <div class="form-group">
        <label>Photos (Max 5 • JPG, PNG, WEBP • up to 5MB each)</label>
        <div class="drop-zone" id="dropZone">
          <span class="drop-icon">📸</span>
          <div class="drop-title">Drag &amp; drop photos here, or click to browse</div>
          <div class="drop-hint">Instant live queue to the Smart TV display</div>
          <input type="file" id="photos" accept=".jpg,.jpeg,.png,.webp" multiple hidden />
        </div>
        <div class="preview-grid" id="previewGrid"></div>
      </div>

      <div class="consent-box">
        <input type="checkbox" id="consent" required />
        <label for="consent">I consent to my name and uploaded photos being displayed publicly on the venue screen.</label>
      </div>

      <button type="submit" class="btn-primary" id="submitBtn">Upload &amp; Cast to Screen</button>
    </form>

    <div id="status" class="status"></div>

    <div class="reaction-panel">
      <div class="reaction-label">Send a live reaction to the TV screen</div>
      <div class="reaction-buttons">
        <button type="button" class="react-btn" data-emoji="❤️">❤️</button>
        <button type="button" class="react-btn" data-emoji="🔥">🔥</button>
        <button type="button" class="react-btn" data-emoji="🎉">🎉</button>
        <button type="button" class="react-btn" data-emoji="👏">👏</button>
        <button type="button" class="react-btn" data-emoji="✨">✨</button>
      </div>
    </div>

    <div class="opt-out">
      <a href="/display" target="_blank" class="link-btn">Open TV Display ↗</a>
      <button type="button" class="btn-danger-ghost" id="deleteBtn">Remove My Photos</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/upload.js"></script>
</body>
</html>
